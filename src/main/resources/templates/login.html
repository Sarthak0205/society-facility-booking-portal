<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign In — SocietyHub</title>

    <link rel="stylesheet" href="/css/login.css">
</head>

<body>

<div class="auth-page">

    <div class="auth-card">

        <!-- Brand -->
        <div class="brand">
            <div class="brand-mark">S</div>
            <span class="brand-name">SocietyHub</span>
        </div>

        <!-- Heading -->
        <div class="auth-header">

            <p class="eyebrow">
                RESIDENT PORTAL
            </p>

            <h1>
                Welcome back.
            </h1>

            <p>
                Sign in to manage your society bookings.
            </p>

        </div>

        <!-- Success -->
        <div th:if="${success}"
             class="alert alert-success"
             th:text="${success}">
        </div>

        <!-- Error -->
        <div th:if="${error}"
             class="alert alert-error"
             th:text="${error}">
        </div>

        <!-- Login -->
        <form action="/users/login"
              method="post"
              class="auth-form">

            <div class="form-group">

                <label for="email">
                    Email address
                </label>

                <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="you@example.com"
                        autocomplete="email"
                        required>

            </div>

            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required>

            </div>

            <button type="submit">
                Sign In
                <span>→</span>
            </button>

        </form>

        <!-- Register -->
        <div class="register-section">

            <span>
                Don't have an account?
            </span>

            <a href="/users/register">
                Create an account
            </a>

        </div>

    </div>

</div>

</body>
</html>
