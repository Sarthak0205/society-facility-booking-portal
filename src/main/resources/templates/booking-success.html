<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Booking Successful - Society Facility Booking Portal</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: #f2f7ff;
      font-family: Arial, sans-serif;
    }

    .success-container {
      width: min(600px, calc(100% - 32px));
      margin: 40px auto;
      padding: 40px;
      background: #ffffff;
      border-radius: 24px;
      box-sizing: border-box;
      text-align: center;
    }

    .success-icon {
      width: 75px;
      height: 75px;
      margin: 0 auto 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #168447;
      border-radius: 50%;
      color: white;
      font-size: 38px;
    }

    h1 {
      margin: 0;
      color: #20242a;
    }

    .subtitle {
      margin: 10px 0 25px;
      color: #737c8d;
      font-size: 18px;
    }

    .success-message {
      margin-bottom: 20px;
      padding: 14px;
      border-radius: 10px;
      background: #e5f7ed;
      color: #176b3a;
      font-weight: 600;
    }

    .booking-details {
      padding: 18px;
      border: 1px solid #d9dfe8;
      border-radius: 14px;
      background: #f8fbff;
      text-align: left;
    }

    .booking-details p {
      margin: 9px 0;
      color: #20242a;
    }

    .booking-details strong {
      color: #2864e8;
    }

    .back-link {
      display: inline-block;
      margin-top: 25px;
      color: #1769ff;
      font-size: 18px;
      font-weight: 700;
      text-decoration: none;
    }

    .back-link:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>

<div class="success-container">

  <div class="success-icon">
    ✓
  </div>

  <h1>Booking Submitted</h1>

  <p class="subtitle">
    Your facility booking request has been submitted successfully.
  </p>

  <div class="success-message">
    Booking status: PENDING
  </div>

  <div class="booking-details">

    <p>
      <strong>Booking ID:</strong>
      <span th:text="${booking.bookingId}">
                1
            </span>
    </p>

    <p>
      <strong>Facility:</strong>
      <span th:text="${booking.slot.facility.facilityName}">
                Community Hall
            </span>
    </p>

    <p>
      <strong>Date:</strong>
      <span th:text="${booking.bookingDate}">
                2026-08-14
            </span>
    </p>

    <p>
      <strong>Time:</strong>
      <span th:text="${booking.slot.startTime + ' - ' + booking.slot.endTime}">
    09:00 - 10:00
      </span>
    </p>

  </div>

  <a href="/facilities" class="back-link">
    Back to Facilities
  </a>

</div>

</body>
</html>
