<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account — SocietyHub</title>

    <link rel="stylesheet" href="/css/register.css">
</head>

<body>

<div class="auth-page">

    <div class="auth-card">

        <!-- Brand -->
        <div class="brand">
            <div class="brand-mark">S</div>
            <span class="brand-name">SocietyHub</span>
        </div>

        <!-- Heading -->
        <div class="auth-header">

            <p class="eyebrow">
                RESIDENT PORTAL
            </p>

            <h1>
                Create your account.
            </h1>

            <p>
                Register to manage your society bookings.
            </p>

        </div>

        <!-- Success -->
        <div th:if="${success}"
             class="alert alert-success"
             th:text="${success}">
        </div>

        <!-- Error -->
        <div th:if="${error}"
             class="alert alert-error"
             th:text="${error}">
        </div>

        <!-- Registration -->
        <form action="/users/register"
              method="post"
              class="auth-form">

            <div class="form-group">

                <label for="fullName">
                    Full name
                </label>

                <input
                        type="text"
                        id="fullName"
                        name="fullName"
                        placeholder="Your full name"
                        autocomplete="name"
                        required>

            </div>

            <div class="form-group">

                <label for="email">
                    Email address
                </label>

                <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="you@example.com"
                        autocomplete="email"
                        required>

            </div>

            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Create a password"
                        minlength="6"
                        autocomplete="new-password"
                        required>

            </div>

            <div class="form-group">

                <label for="confirmPassword">
                    Confirm password
                </label>

                <input
                        type="password"
                        id="confirmPassword"
                        name="confirmPassword"
                        placeholder="Re-enter your password"
                        autocomplete="new-password"
                        required>

            </div>

            <button type="submit">
                Create Account
                <span>→</span>
            </button>

        </form>

        <!-- Login -->
        <div class="register-section">

            <span>
                Already have an account?
            </span>

            <a href="/users/login">
                Sign In
            </a>

        </div>

    </div>

</div>

</body>
</html>
